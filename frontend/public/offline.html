<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kipd — Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #faf9f7;
      color: #232323;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 20px;
      padding: 40px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      color: #d97706;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1c1917;
    }
    p {
      font-size: 14px;
      color: #78716c;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      background-color: #d97706;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
      touch-action: manipulation;
    }
    .btn:active {
      background-color: #b45309;
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #a8a29e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M1 9l2 2m3.5-3.5a15.918 15.918 0 0113.88 0M6 13a10.96 10.96 0 018.73-1.63M9.5 17a5.978 5.978 0 013.9-1.28" />
      </svg>
    </div>
    <h1>No Connection</h1>
    <p>We couldn't connect to Kipd. Please check your internet or Wi-Fi connection and tap below to retry.</p>
    <button class="btn" id="retry-btn" onclick="retryConnection()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Retry Connection
    </button>
    <div class="status" id="status-text">Auto-retrying when network reconnects...</div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      btn.innerText = 'Connecting...';
      btn.disabled = true;
      window.location.href = 'https://sa-kipd.vercel.app/';
    }

    // Auto-reload as soon as device gets back online
    window.addEventListener('online', function() {
      const status = document.getElementById('status-text');
      if (status) status.innerText = 'Network restored! Reconnecting...';
      setTimeout(function() {
        window.location.href = 'https://sa-kipd.vercel.app/';
      }, 500);
    });
  </script>
</body>
</html>
