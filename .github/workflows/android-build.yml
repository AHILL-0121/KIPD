name: CI and Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values so the app can compile in CI. Real secrets are never needed to build or test.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZHVtbXlrZXk="
  CLERK_SECRET_KEY: "sk_test_dummykey"
  DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"

jobs:
  quality:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      # Includes the cross-tenant isolation suite: one tenant must never read or change another's data.
      - name: Test
        working-directory: ./frontend
        run: npm test

      - name: Build (type and lint checks are on)
        working-directory: ./frontend
        run: npm run build

  android:
    name: Build Android APK
    needs: quality
    # Pull requests only run the checks above; the APK is built from main or on demand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies and build Next.js
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: ./frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kipd-app-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
