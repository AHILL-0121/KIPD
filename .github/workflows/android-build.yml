name: CI and Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values so the app can compile in CI. Real secrets are never needed to build or test.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZHVtbXlrZXk="
  CLERK_SECRET_KEY: "sk_test_dummykey"
  DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"

jobs:
  quality:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Dependency security audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      # Includes the cross-tenant isolation suite: one tenant must never read or change another's data.
      - name: Test
        working-directory: ./frontend
        run: npm test

      - name: Build (type and lint checks are on)
        working-directory: ./frontend
        run: npm run build

  android:
    name: Build Android APK
    needs: quality
    # Pull requests only run the checks above; the APK is built from main or on demand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies and build Next.js
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -PAPP_VERSION_CODE=${{ github.run_number }} -PAPP_VERSION_NAME=1.0.${{ github.run_number }} --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kipd-app-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Release Keystore
        if: github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/android/app/release.keystore

      - name: Build Signed Release APK & AAB
        if: github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: ./frontend/android
        env:
          KIPD_UPLOAD_STORE_FILE: release.keystore
          KIPD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIPD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIPD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease -PAPP_VERSION_CODE=${{ github.run_number }} -PAPP_VERSION_NAME=1.0.${{ github.run_number }} --stacktrace

      - name: Publish Signed Release to GitHub Releases
        if: github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            frontend/android/app/build/outputs/apk/release/app-release.apk \
            frontend/android/app/build/outputs/bundle/release/app-release.aab \
            --title "Kipd Android 1.0.${{ github.run_number }}" \
            --notes "Automated signed Android build from main (${{ github.sha }})"
